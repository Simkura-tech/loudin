# Nginx config for Frontend VM
# Serves the Vite static build directly — no proxy, no Docker.
# Placeholders replaced by setup script: app.yourdomain.com → domain, REPO_DIR → /opt/loudin

server {
    listen 80;
    server_name app.yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name app.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/app.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.yourdomain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root REPO_DIR/apps/web/dist;
    index index.html;

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets for 1 year
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}

# ── Apex → www redirect ──────────────────────────────────────────────────────
# The canonical host is the subdomain above (e.g. www.yourdomain.com). The bare
# apex (yourdomain.com) must still resolve and 301 here, or links/typed URLs to
# it dead-end and any SEO value pointing at the apex is lost.
#
# To enable:
#   1. DNS: add an A record for the apex pointing at this VM's static IP.
#   2. Cert: expand the certificate to cover both names:
#        sudo certbot --nginx -d www.yourdomain.com -d yourdomain.com
#   3. Replace yourdomain.com below with the real domain and reload nginx.

server {
    listen 80;
    server_name yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.yourdomain.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.yourdomain.com$request_uri;
}
