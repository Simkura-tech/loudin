# nginx config for the docker-compose web container.
#
# Serves the built SPA and reverse-proxies backend traffic to the `api`
# compose service so the browser only ever talks to one origin
# (http://localhost:8081). That keeps VITE_API_BASE_URL empty and avoids
# CORS entirely — the same shape as the Vite dev proxy.

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # REST API.
    # Note: X-Forwarded-For is intentionally NOT forwarded — the API trusts
    # only loopback proxies (`app.set('trust proxy', 'loopback')`), and
    # express-rate-limit rejects an untrusted X-Forwarded-For header.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Socket.io — needs the WebSocket upgrade headers.
    location /socket.io/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }

    # SPA fallback — client-side routes (react-router) resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
